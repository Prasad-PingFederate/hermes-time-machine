name: time-machine
repo: https://github.com/Prasad-PingFederate/hermes-time-machine
sha: d63b91e4e0096815c2c96332e168e1a5586b38f2
description: >-
  Visual timeline scrubber, surgical file rollback, session branching, and one-call self-heal for Hermes Agent and Desktop. Diagnoses the broken file, restores only that file, removes stray files, and re-runs the failed test.
maintainer: Prasad-PingFederate
tier: community
category: desktop
requires_hermes: ">=0.21.0"
docs_url: https://github.com/Prasad-PingFederate/hermes-time-machine#readme
version: "0.3.0"
platforms: []
capabilities:
  provides_tools:
    - time_machine_list_snapshots
    - time_machine_diff
    - time_machine_restore
    - time_machine_branch
    - time_machine_recover
    - time_machine_search
  provides_hooks:
    - on_session_start
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
  provides_middleware: []
  requires_env: []
