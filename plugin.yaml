name: hermes-time-machine
version: "0.3.0"
description: "Unified Time Machine for Hermes Agent: pairs shadow-git filesystem checkpoints with state.db conversation turns for atomic rewind, diff, session branching, and autonomous self-healing recovery."
author: "Prasad-PingFederate"
manifest_version: 2
api_version: 1
license: MIT
tags: [desktop, safety, productivity]

provides_tools:
  - time_machine_list_snapshots
  - time_machine_diff
  - time_machine_restore
  - time_machine_branch
  - time_machine_recover

provides_hooks:
  - on_session_start
  - pre_tool_call
  - post_tool_call
  - transform_tool_result

python_dependencies: []

config_schema:
  safe_mode:
    type: bool
    default: true
    description: "Aggressive checkpointing and proactive self-healing recovery recommendations"
  auto_enable_checkpoints:
    type: bool
    default: true
    description: "Force-enable Hermes checkpoints when this plugin loads"
  snapshot_on_every_tool:
    type: bool
    default: false
    description: "Aggressive mode (higher disk use)"
  max_snapshots_per_session:
    type: int
    default: 50
    description: "Maximum snapshots retained per session before pruning oldest"
