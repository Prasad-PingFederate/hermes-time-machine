name: time-machine
version: "0.4.1"
requires_hermes: ">=0.21.0"
description: "Visual timeline scrubber, surgical file rollback, and autonomous self-healing for Hermes Agent & Desktop."
author: "Prasad-PingFederate"
manifest_version: 2
api_version: 1
license: MIT
tags: [desktop, safety, checkpoints, rollback, debugging, developer-tools]

provides_tools:
  - time_machine_list_snapshots
  - time_machine_diff
  - time_machine_restore
  - time_machine_recover
  - time_machine_search

provides_commands:
  - tm

provides_hooks:
  - on_session_start
  - pre_tool_call
  - post_tool_call
  - transform_tool_result

python_dependencies: []

config_schema:
  snapshot_on_every_tool:
    type: bool
    default: false
    description: "Capture snapshots before every tool call (default: false, snapshots file mutations and terminal commands)"
  max_snapshots_per_session:
    type: int
    default: 100
    description: "Maximum snapshots retained per session before pruning oldest"
