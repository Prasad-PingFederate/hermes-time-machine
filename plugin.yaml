name: hermes-time-machine
version: 0.1.0
description: "Visual timeline + one-click restore & branch for autonomous Hermes sessions. Makes checkpoints fearless."
manifest_version: 2
api_version: 1
license: MIT
tags: [desktop, safety, productivity]
provides_tools:
  - time_machine_list_snapshots
  - time_machine_diff
  - time_machine_restore
  - time_machine_branch
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
python_dependencies: []
config_schema:
  auto_enable_checkpoints:
    type: bool
    default: true
    description: "Force-enable Hermes checkpoints when this plugin loads"
  snapshot_on_every_tool:
    type: bool
    default: false
    description: "Aggressive mode (higher disk use)"
